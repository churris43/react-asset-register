services:
  webapp:
    build:
      context: ./frontend
    container_name: express_webapp
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://api:3000
    depends_on:
      - api
    command: npm run dev
    expose:
      - "5173"

  api:
    build:
      context: ./backend
    container_name: express_api
    volumes:
      - ./backend:/app
      - /app/node_modules # Restricts the host from overwritting the node modules
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: npm run dev # Active local development, Live reloading, hot module replacement, detailed logging, file watching.
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: express_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - webapp

  postgres:
    image: postgres:16-alpine
    container_name: express_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    container_name: express_migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    restart: "no"

volumes:
  postgres_data:
